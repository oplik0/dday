name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: # allow running the (optional) e2e job on demand

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-ed:"; echo "$out"; exit 1
          fi

      # The bot uses mautrix with pure-Go olm/megolm, selected by -tags goolm;
      # everything below runs with the tag so the bot's E2EE code path is
      # vetted/built/tested. The tag is inert for the web/store/regwindow
      # packages, which do not import mautrix.
      - name: go vet
        run: go vet -tags goolm ./...

      - name: build (goolm)
        run: go build -tags goolm ./...

      # Sanity: the tag-free build must also compile (the bot then falls back to
      # the stub main that refuses to run without E2EE).
      - name: build (no tag)
        run: go build ./...

      - name: test (race)
        run: go test -race -tags goolm ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t dday:ci .

  # OPTIONAL, NON-BLOCKING end-to-end encryption test. It stands up a real
  # Synapse in Docker and drives the real bot (mautrix + cryptohelper) through a
  # full encrypted round-trip. It is deliberately kept OUT of the required `test`
  # job: Synapse startup + a live megolm exchange are heavier and inherently
  # flakier than a hermetic unit test, and must never gate a merge.
  #
  # `continue-on-error: true` makes this job advisory — a red e2e never blocks
  # the branch; the required signal is the `test` and `docker` jobs above. The
  # authoritative way to run it is locally: `make e2e`.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Stand up Synapse + run the E2EE round-trip
        run: make e2e
